---
- hosts: frontend
  become: yes
  tasks:
    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Copy frontend files
      copy:
        src: ../frontend/
        dest: /usr/share/nginx/html/

    - name: Replace BACKEND_IP placeholder in index.html
      replace:
        path: /usr/share/nginx/html/index.html
        regexp: 'BACKEND_IP'
        replace: "{{ groups['backend'][0] }}"

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: yes

- hosts: backend
  become: yes
  tasks:
    - name: Install python3
      yum:
        name: python3
        state: present

    - name: Install python3-pip
      yum:
        name: python3-pip
        state: present

    - name: Install flask
      pip:
        name: flask
        executable: pip3

    - name: Create backend directory
      file:
        path: /home/ec2-user/backend
        state: directory
        owner: ec2-user
        mode: '0755'

    - name: Copy backend files
      copy:
        src: ../backend/
        dest: /home/ec2-user/backend/

    - - name: Kill any existing flask process
        shell: |
          PID=$(pgrep -f "python3.*app.py") && kill $PID || true
        args:
           executable: /bin/bash
        ignore_errors: true

    - name: Run flask app
      shell: |
        nohup python3 /home/ec2-user/backend/app.py > /tmp/flask.log 2>&1 &
      args:
        executable: /bin/bash

    - name: Wait for flask to start
      wait_for:
        port: 5000
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 30
