<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --c1: #FF6B6B; --c2: #FF9F43; --c3: #FECA57; --c4: #48DBFB;
      --c5: #FF9FF3; --c6: #54A0FF; --c7: #5F27CD; --c8: #00D2D3;
      --c9: #1DD1A1; --c10: #EE5A24;
      --bg: #0F0F1A; --card: #1A1A2E; --card2: #16213E;
      --text: #F0F0FF; --muted: #8888AA; --done-bg: #1a2e1a;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); overflow-x: hidden; }
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; z-index: 0; animation: drift 12s ease-in-out infinite alternate; }
    .blob1 { width: 500px; height: 500px; background: #FF6B6B; top: -150px; left: -100px; animation-duration: 14s; }
    .blob2 { width: 400px; height: 400px; background: #54A0FF; bottom: -100px; right: -100px; animation-duration: 10s; }
    .blob3 { width: 300px; height: 300px; background: #1DD1A1; top: 40%; left: 50%; animation-duration: 16s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.08); } }
    .container { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 40px 20px 80px; }
    .header { text-align: center; margin-bottom: 40px; animation: slideDown 0.6s ease; }
    .header h1 { font-family: 'Righteous', cursive; font-size: 3rem; background: linear-gradient(135deg, #FF6B6B, #FF9F43, #FECA57, #48DBFB, #FF9FF3); background-size: 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: gradientShift 4s ease infinite; letter-spacing: 2px; }
    .header p { color: var(--muted); font-size: 1rem; margin-top: 6px; font-weight: 600; }
    @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; animation: slideDown 0.7s ease; }
    .stat-chip { padding: 6px 18px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; border: 2px solid transparent; }
    .stat-total { background: #1e1e35; border-color: #54A0FF; color: #54A0FF; }
    .stat-done  { background: #1a2e1a; border-color: #1DD1A1; color: #1DD1A1; }
    .stat-left  { background: #2e1a1a; border-color: #FF6B6B; color: #FF6B6B; }
    .input-area { display: flex; gap: 10px; margin-bottom: 32px; animation: slideDown 0.8s ease; }
    .input-area input { flex: 1; padding: 14px 20px; border-radius: 16px; border: 2px solid #2a2a4a; background: var(--card); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
    .input-area input:focus { border-color: #54A0FF; box-shadow: 0 0 0 4px rgba(84,160,255,0.15); }
    .input-area input::placeholder { color: var(--muted); }
    .add-btn { padding: 14px 28px; border-radius: 16px; border: none; background: linear-gradient(135deg, #54A0FF, #5F27CD); color: white; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(84,160,255,0.35); white-space: nowrap; }
    .add-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(84,160,255,0.5); }
    .add-btn:active { transform: translateY(0); }
    .progress-wrap { margin-bottom: 28px; animation: slideDown 0.75s ease; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .progress-bar-bg { height: 8px; background: #1e1e35; border-radius: 50px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 50px; background: linear-gradient(90deg, #1DD1A1, #48DBFB, #54A0FF); background-size: 200%; transition: width 0.5s ease; animation: gradientShift 3s ease infinite; }
    .section-label { font-size: 0.75rem; font-weight: 800; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; padding-left: 4px; }
    #tasks { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .todo-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 18px; background: var(--card2); border: 2px solid transparent; cursor: pointer; transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); animation: popIn 0.4s ease both; user-select: none; position: relative; overflow: hidden; }
    .todo-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; background: var(--item-color, #54A0FF); transition: width 0.35s ease; }
    .todo-item:hover { transform: translateX(4px) scale(1.01); }
    .todo-item:hover::before { width: 6px; }
    .check-circle { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--item-color, #54A0FF); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s ease; background: transparent; }
    .check-circle svg { opacity: 0; transition: opacity 0.25s ease; width: 14px; height: 14px; }
    .todo-text { flex: 1; font-size: 1rem; font-weight: 700; color: var(--text); transition: all 0.3s ease; }
    .todo-tag { font-size: 0.7rem; font-weight: 800; padding: 3px 10px; border-radius: 50px; background: color-mix(in srgb, var(--item-color, #54A0FF) 15%, transparent); color: var(--item-color, #54A0FF); border: 1px solid color-mix(in srgb, var(--item-color, #54A0FF) 40%, transparent); white-space: nowrap; }
    .delete-btn { background: none; border: none; color: #444466; cursor: pointer; font-size: 1.1rem; padding: 4px; border-radius: 8px; transition: color 0.2s, background 0.2s; flex-shrink: 0; }
    .delete-btn:hover { color: #FF6B6B; background: rgba(255,107,107,0.1); }
    .todo-item.done { background: var(--done-bg); border-color: color-mix(in srgb, var(--item-color) 30%, transparent); opacity: 0.8; }
    .todo-item.done .check-circle { background: var(--item-color); border-color: var(--item-color); }
    .todo-item.done .check-circle svg { opacity: 1; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-item.done .todo-tag { opacity: 0.5; }
    .color-0 { --item-color: #FF6B6B; } .color-1 { --item-color: #FF9F43; } .color-2 { --item-color: #FECA57; }
    .color-3 { --item-color: #48DBFB; } .color-4 { --item-color: #FF9FF3; } .color-5 { --item-color: #54A0FF; }
    .color-6 { --item-color: #5F27CD; } .color-7 { --item-color: #00D2D3; } .color-8 { --item-color: #1DD1A1; }
    .color-9 { --item-color: #EE5A24; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); display: none; }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 10px; }
    .empty-state p { font-weight: 700; font-size: 1rem; }
    .error-msg { background: rgba(255,107,107,0.1); border: 1px solid #FF6B6B; color: #FF6B6B; padding: 12px 18px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; margin-bottom: 20px; display: none; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.85) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.9) translateX(20px); height: 0; padding: 0; margin: 0; } }
    .burst { position: fixed; pointer-events: none; z-index: 999; font-size: 1.4rem; animation: burstAnim 0.8s ease forwards; }
    @keyframes burstAnim { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); } }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="container">
    <div class="header">
      <h1>✦ My Todo App ✦</h1>
      <p>Click any task to mark it complete</p>
    </div>

    <div class="stats">
      <div class="stat-chip stat-total">📋 Total: <span id="stat-total">0</span></div>
      <div class="stat-chip stat-done">✅ Done: <span id="stat-done">0</span></div>
      <div class="stat-chip stat-left">🔥 Left: <span id="stat-left">0</span></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progress</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="input-area">
      <input id="task" placeholder="✏️  Add a new task..." onkeydown="if(event.key==='Enter') addTask()" />
      <button class="add-btn" onclick="addTask()">+ Add Task</button>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="section-label">Your Tasks</div>

    <ul id="tasks"></ul>

    <div class="empty-state" id="empty-state">
      <div class="emoji">📝</div>
      <p>No tasks yet! Add one above to get started.</p>
    </div>
  </div>

  <script>
    const API = "http://BACKEND_IP:5000/tasks";

    const COLORS = [
      { cls: "color-0", tag: "Personal"  },
      { cls: "color-1", tag: "Work"      },
      { cls: "color-2", tag: "Shopping"  },
      { cls: "color-3", tag: "Health"    },
      { cls: "color-4", tag: "Family"    },
      { cls: "color-5", tag: "Learning"  },
      { cls: "color-6", tag: "Finance"   },
      { cls: "color-7", tag: "Travel"    },
      { cls: "color-8", tag: "Fitness"   },
      { cls: "color-9", tag: "Creative"  },
    ];

    let localTasks = [];
    let doneSet = new Set();

    function showError(msg) {
      const el = document.getElementById("error-msg");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => el.style.display = "none", 4000);
    }

    function updateStats() {
      const total = localTasks.length;
      const done  = doneSet.size;
      const left  = total - done;
      const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-done").textContent  = done;
      document.getElementById("stat-left").textContent  = left;
      document.getElementById("progress-pct").textContent = pct + "%";
      document.getElementById("progress-bar").style.width = pct + "%";
      const emptyState = document.getElementById("empty-state");
      const tasksList  = document.getElementById("tasks");
      if (total === 0) {
        emptyState.style.display = "block";
        tasksList.style.display  = "none";
      } else {
        emptyState.style.display = "none";
        tasksList.style.display  = "flex";
      }
    }

    function renderTasks(tasks) {
      const ul = document.getElementById("tasks");
      ul.innerHTML = "";
      localTasks = tasks;
      if (tasks.length === 0) { updateStats(); return; }
      tasks.forEach((task, index) => {
        const colorInfo = COLORS[index % COLORS.length];
        const isDone    = doneSet.has(task);
        const li = document.createElement("li");
        li.className = `todo-item ${colorInfo.cls} ${isDone ? "done" : ""}`;
        li.style.animationDelay = (index * 0.06) + "s";
        li.dataset.task = task;
        li.innerHTML = `
          <div class="check-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="todo-text">${escapeHtml(task)}</span>
          <span class="todo-tag">${colorInfo.tag}</span>
          <button class="delete-btn" title="Delete task" onclick="deleteTask(event, '${escapeHtml(task)}')">✕</button>
        `;
        li.addEventListener("click", (e) => {
          if (e.target.closest(".delete-btn")) return;
          toggleDone(li, task);
        });
        ul.appendChild(li);
      });
      updateStats();
    }

    function toggleDone(li, task) {
      if (doneSet.has(task)) {
        doneSet.delete(task);
        li.classList.remove("done");
      } else {
        doneSet.add(task);
        li.classList.add("done");
        spawnBurst(li);
      }
      updateStats();
    }

    function spawnBurst(el) {
      const rect   = el.getBoundingClientRect();
      const emojis = ["🎉","✨","🌟","💥","🎊","⚡","🔥","💫"];
      for (let i = 0; i < 6; i++) {
        const span  = document.createElement("span");
        span.className = "burst";
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const angle = (Math.PI * 2 * i) / 6;
        const dist  = 60 + Math.random() * 40;
        span.style.left = (rect.left + rect.width / 2) + "px";
        span.style.top  = (rect.top  + rect.height / 2) + "px";
        span.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        span.style.setProperty("--ty", Math.sin(angle) * dist + "px");
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 850);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function loadTasks() {
      fetch(API)
        .then(res => { if (!res.ok) throw new Error("Server error"); return res.json(); })
        .then(data => renderTasks(data || []))
        .catch(() => {
          renderTasks([]);
          showError("⚠️ Could not connect to backend.");
        });
    }

    function addTask() {
      const input = document.getElementById("task");
      const task  = input.value.trim();
      if (!task) { input.focus(); return; }
      fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task })
      })
      .then(res => { if (!res.ok) throw new Error(); return res; })
      .then(() => { input.value = ""; input.focus(); loadTasks(); })
      .catch(() => {
        localTasks.push(task);
        input.value = "";
        renderTasks(localTasks);
      });
    }

    function deleteTask(e, task) {
      e.stopPropagation();
      const li = e.target.closest(".todo-item");
      li.style.animation = "fadeOut 0.3s ease forwards";
      setTimeout(() => {
        fetch(API + "/" + encodeURIComponent(task), { method: "DELETE" })
          .catch(() => {})
          .finally(() => { doneSet.delete(task); loadTasks(); });
      }, 300);
    }

    loadTasks();
  </script>
</body>
</html>
